      - download_sample_size_data
      - load_sample_size_data
      - cache_clear
      - cache_info
  - title: Simulates Data Sets
    contents:
      - draw_sample_normal
      - draw_sample_mixture
  - title: Example Data
    contents:
      - df_stress
      - df_income
      - df_cancer
